# The PR title becomes the squash commit on main, and release-please reads it to pick
# the next version, so it must be a conventional commit ("feat: ...", "fix!: ...").
# Required check: never add path filters here or to ci.yml.
name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            test
            chore
            perf
            ci
            build
            revert
          requireScope: false
