name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode on the runner
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      # The release job builds Release (optimised, whole module), which can hit compiler
      # bugs a Debug build never sees. Build it here so a PR can't break the next release.
      - name: Release build
        run: |
          xcodebuild -project Wisp.xcodeproj -scheme Wisp -configuration Release \
            -derivedDataPath build/ci-release -destination "generic/platform=macOS" -quiet \
            CODE_SIGNING_ALLOWED=NO build
