# Required check: `test`. Never add path filters here; the release PR only touches
# CHANGELOG.md and project.yml and must still get a result.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR replaces the run for the old commit. Runs on main always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_ENV_HINTS: "1"

jobs:
  unit-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode on the runner
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Lint
        run: make lint
      - name: Test
        run: make test

  # The release job builds Release (optimised, whole module), which can hit compiler bugs a
  # Debug build never sees. Build it here so a PR can't break the next release. Each
  # architecture gets its own runner: one whole-module compile per arch is mostly
  # single-threaded, so two side by side on one 3-core runner nearly doubles the time.
  release-build:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode on the runner
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Release build (${{ matrix.arch }})
        run: |
          xcodegen generate --quiet
          xcodebuild -project Wisp.xcodeproj -scheme Wisp -configuration Release \
            -derivedDataPath build/ci-release -destination "generic/platform=macOS" -quiet \
            ARCHS=${{ matrix.arch }} ONLY_ACTIVE_ARCH=NO COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO build

  # The required check. It passes only when lint, the tests and both Release builds passed,
  # so the jobs above can run side by side without changing what a PR needs to merge.
  test:
    needs: [unit-tests, release-build]
    # always(), not !cancelled(): a skipped required check counts as passing, so a cancelled
    # run must fail here instead.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Lint, tests and Release builds passed
        env:
          UNIT_TESTS: ${{ needs.unit-tests.result }}
          RELEASE_BUILD: ${{ needs.release-build.result }}
        run: |
          echo "unit-tests: $UNIT_TESTS, release-build: $RELEASE_BUILD"
          [ "$UNIT_TESTS" = success ] && [ "$RELEASE_BUILD" = success ]
