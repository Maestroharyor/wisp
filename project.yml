name: Wisp

options:
  bundleIdPrefix: com.maestro
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
    # Overridden by the Makefile with "Wisp Dev" once that certificate exists.
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  # Pure logic with no AppKit, so it is unit-testable without launching the app.
  WispCore:
    type: library.static
    platform: macOS
    sources: [WispCore]
    settings:
      base:
        PRODUCT_NAME: WispCore
        # Swift-only library: no Objective-C header to install (the copy step trips
        # Xcode's build sandbox).
        SWIFT_INSTALL_OBJC_HEADER: NO

  # Hosted by /usr/bin/perl to read system-wide Now Playing (see the source header).
  WispMediaBridge:
    type: library.dynamic
    platform: macOS
    sources: [WispMediaBridge]
    settings:
      base:
        PRODUCT_NAME: WispMediaBridge
        EXECUTABLE_PREFIX: lib
        CLANG_ENABLE_OBJC_ARC: YES
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        SKIP_INSTALL: YES
        OTHER_LDFLAGS: ["-framework", "Foundation", "-framework", "AppKit"]

  # Claude Code hook command that forwards hook events to Wisp (see WispAgent/main.swift).
  WispAgent:
    type: tool
    platform: macOS
    sources: [WispAgent]
    dependencies:
      - target: WispCore
    settings:
      base:
        PRODUCT_NAME: wisp-agent
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES

  Wisp:
    type: application
    platform: macOS
    sources: [Wisp]
    dependencies:
      - target: WispCore
      - target: WispAgent
        embed: true
        codeSign: true
        copy:
          destination: executables
      - target: WispMediaBridge
        link: false
        embed: true
        codeSign: true
        copy:
          destination: resources
    info:
      path: Wisp/Resources/Info.plist
      properties:
        CFBundleDisplayName: Wisp
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        # Menu bar app: no Dock icon or app menu.
        LSUIElement: true
        NSHumanReadableCopyright: "© 2026 Ayomide Odewale"
        NSAppleEventsUsageDescription: Wisp reads what is playing in Music and Spotify and controls playback from the notch.
        NSCalendarsFullAccessUsageDescription: Wisp shows your next events in the Calendar widget.
        NSLocationUsageDescription: Wisp uses your approximate location for the Weather widget.
        NSLocationWhenInUseUsageDescription: Wisp uses your approximate location for the Weather widget.
        NSContactsUsageDescription: Wisp shows contact photos on notifications.
        NSCameraUsageDescription: Wisp shows your camera in the Mirror widget so you can check yourself before a call.
    entitlements:
      path: Wisp/Resources/Wisp.entitlements
      properties:
        # Not sandboxed: event taps, hidutil and private frameworks need it.
        com.apple.security.app-sandbox: false
        # Hardened runtime resource access for Now Playing, Calendar and Weather.
        com.apple.security.automation.apple-events: true
        com.apple.security.personal-information.calendars: true
        com.apple.security.personal-information.location: true
        com.apple.security.personal-information.addressbook: true
        com.apple.security.device.camera: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maestro.wisp
        PRODUCT_NAME: Wisp
        ENABLE_HARDENED_RUNTIME: YES
        # A self-signed certificate has no Team ID, so hardened runtime's library
        # validation rejects Xcode's separate debug dylib. Keep debug builds monolithic.
        ENABLE_DEBUG_DYLIB: NO
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  WispTests:
    type: bundle.unit-test
    platform: macOS
    sources: [WispTests]
    dependencies:
      - target: WispCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maestro.wisp.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Wisp:
    build:
      targets:
        Wisp: all
    run:
      config: Debug
  WispCore:
    build:
      targets:
        WispCore: all
        WispTests: [test]
    test:
      config: Debug
      targets: [WispTests]
